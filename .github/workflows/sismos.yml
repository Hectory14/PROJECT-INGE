name: Alertas de sismos

on:
  schedule:
    - cron: "*/5 * * * *"   # cada 5 minutos (UTC); GitHub puede retrasarlo
  workflow_dispatch:         # botón "Run workflow" para ejecutarlo a mano

permissions:
  contents: write            # para guardar estado.json en el repositorio

concurrency:
  group: sismos
  cancel-in-progress: false  # nunca dos ejecuciones a la vez

jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Buscar sismos y publicar
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python sismos.py

      - name: Guardar estado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add estado.json
          if git diff --cached --quiet; then
            echo "Sin cambios en el estado."
          else
            git commit -m "Actualizar estado de sismos"
            git pull --rebase
            git push
          fi
